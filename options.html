<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plato Enhanced 설정</title>
  <link rel="stylesheet" href="styles/options.css">
  <script src="src/nespa-settings.js" defer></script>
  <script src="options.js" defer></script>
</head>
<body>
  <main>
    <header><h1>NESPA 달력 연동</h1><p>NESPA 과제 일정과 제출 상태를 PLATO 달력에서 확인합니다.</p></header>
    <form id="settings-form" class="card">
      <div class="section-heading"><div><h2>연동 설정</h2><p>달력에 표시할 NESPA 강좌를 선택하세요.</p></div><label class="toggle"><input id="enabled" type="checkbox"><span>사용</span></label></div>
      <div class="fields">
        <label for="course-url">NESPA 강좌 주소<input id="course-url" type="url" required spellcheck="false" autocomplete="off" placeholder="https://emerald.pusan.ac.kr/ds2026/"><small>emerald.pusan.ac.kr의 강좌 주소를 입력하세요.</small></label>
        <div class="row"><label for="course-name">달력에 표시할 강좌명<input id="course-name" type="text" maxlength="60" required></label><label for="course-year">학년도<input id="course-year" type="number" min="2000" max="2100" required></label></div>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
      <footer><span>변경 사항은 열린 PLATO 달력에 반영됩니다.</span><button type="submit" aria-describedby="status">설정 저장</button></footer>
    </form>
    <section class="notice" aria-label="NESPA 로그인 안내">
      <p>NESPA에서 직접 로그인한 뒤 PLATO 달력의 새로고침 버튼을 누르세요. 세션이 만료되면 다시 로그인해야 합니다.</p>
      <a id="nespa-login-link" href="https://emerald.pusan.ac.kr/ds2026/login/" target="_blank" rel="noopener noreferrer">NESPA 로그인 열기</a>
    </section>
    <p class="footnote">기존 PLATO 달력, 완료 표시와 주차별 자료 기능은 계속 사용할 수 있습니다.</p>
  </main>
</body>
</html>
